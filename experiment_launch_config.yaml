experiment:
  name: "hybrid_graphrag_amazon"
  version: "1.0.0"
  seed: 4720
  device: "cuda"  #"cpu"

# Phase 1: Bootstrap Configuration
bootstrap:
  enabled: true
  num_users: 500
  num_items_per_user: 10
  max_reflection_iterations: 2
  lazy_propagation_threshold: 0.3
  
  graph:
    similarity_threshold_user: 0.7
    similarity_threshold_item: 0.6
    co_interaction_min_shared: 3
    edge_prune_threshold: 0.05
    edge_update_delta: 0.1

  memory:
    max_interaction_buffer: 10
    decay_lambda: 0.1
    max_preference_patterns: 20
    intrinsic_frozen: true
    
  # Graph RAG
  graph_rag:
    max_hops: 2
    top_k_paths: 15
    metapath_types:
      - "user-item-user"
      - "user-user-item"
      - "item-item-analogy"

# Phase 2: Distillation Configuration  
distillation:
  enabled: true
  num_epochs: 200
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  
  # HGNN architecture
  hgnn:
    input_dim: 256
    hidden_dim: 256
    output_dim: 256
    num_layers: 2
    dropout: 0.2
  
  # Loss weights
  loss_weights:
    tier_regression: 1.0
    path_importance: 0.3
    contrastive: 0.1
    reconstruction: 0.05
    tier_weights:
      intrinsic: 0.3
      collaborative: 1.0
      interaction: 0.2

# Phase 3: Inference Configuration
inference:
  enabled: true
  num_test_users: 100
  num_negatives: 99
  
  # Adaptive gating
  gating:
    default_threshold: 0.3
    features:
      - "confidence"
      - "density"
      - "criticality"
      - "staleness"
    sync_period: 20  # Steps between text/embedding sync
    
  # GNN path
  gnn_path:
    collaborative_weight: 1.0
    content_weight: 0.3
    graph_context_weight: 0.2

# LLM Configuration
llm:
  path: "/media/hdd/models/text/Qwen3-4B-Instruct-2507/"
  api_key_env: "OPENAI_API_KEY"
  default_model: "gpt-3.5-turbo-16k"
  embedding_model: "text-embedding-ada-002"
  
  # Model selection by task
  task_models:
    decision: "gpt-3.5-turbo-16k"
    reflection: "gpt-3.5-turbo-16k"
    simple_choice: "text-davinci-003"
    
  generation:
    temperature: 0.3
    max_tokens_decision: 500
    max_tokens_reflection: 2000

dataset:
  name: "amazon_reviews"
  path: "/home/person/projects/doc_rec_sys/datasets/cd_and_vinyl"
  domains:
    - "CDs_and_Vinyl"
    - "Office_Products"
  
  subsample:
    phase1_users: 500
    phase3_users: 100
    min_interactions: 5
    max_interactions: 50
  
  preprocessing:
    max_description_length: 100
    remove_html: true
    normalize_whitespace: true
    min_word_count: 3

evaluation:
  metrics:
    - "ndcg"
    - "hit_rate"
    - "mrr"
  k_values: [1, 5, 10]
  num_repetitions: 3
  
  # Cold-start analysis
  cold_start:
    enabled: true
    thresholds: [5, 10, 20]  # Interaction count thresholds

# Output Configuration
output:
  save_dir: "./results"
  save_agents: true
  save_graph: true
  save_model: true
  log_level: "INFO"
  log_file: "experiment.log"

# Cost tracking
cost_tracking:
  enabled: true
  budget_limit: 200.0  # USD
  warn_threshold: 0.8  # Warn at 80% of budget